<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Sopro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <rect width="720" height="200" rx="20" fill="url(#bg)"/>

  <g transform="translate(64 100)" fill="url(#wave)" opacity="0.95">
    <rect x="-34" y="-10" width="8" height="20" rx="4"/>
    <rect x="-18" y="-26" width="8" height="52" rx="4"/>
    <rect x="-2"  y="-44" width="8" height="88" rx="4"/>
    <rect x="14"  y="-22" width="8" height="44" rx="4"/>
    <rect x="30"  y="-34" width="8" height="68" rx="4"/>
    <rect x="46"  y="-14" width="8" height="28" rx="4"/>
  </g>

  <text x="150" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="url(#text)" letter-spacing="2">Sopro</text>

  <text x="154" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="17" fill="#94a3b8" letter-spacing="0.5">termos técnicos explicados no momento em que são falados</text>
</svg>
