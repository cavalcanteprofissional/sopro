name: release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -e ".[dev,packaging,ui,audio,stt]"

      - name: Testes
        run: python -m pytest -q

      - name: Validar glossário
        run: python -m sopro.core.glossary.validate data/domains/tech-en-pt

      - name: Build (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean sopro.spec

      - name: Portátil (zip)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          Compress-Archive -Path dist/Sopro -DestinationPath "dist/Sopro-$version-portable.zip" -Force

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          iscc //DVersion=$version installer.iss

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem Sopro-*.exe, Sopro-*-portable.zip |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            } |
            Out-File SHA256SUMS.txt -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Sopro-Setup-*.exe
            dist/Sopro-*-portable.zip
            dist/SHA256SUMS.txt
